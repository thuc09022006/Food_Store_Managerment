spring.application.name=foodstore-management

# ---------- Datasource ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodstore_db}
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.config.import=optional:file:./application-local.properties

# Không tự động chạy schema.sql / data.sql
spring.sql.init.mode=never

# ---------- Web ----------
server.port=8080
server.servlet.session.timeout=30m
spring.thymeleaf.cache=false
spring.main.banner-mode=off

# ---------- Tham số nghiệp vụ ----------
store.vat-rate=0.08
store.expiry-warning-days=7

# Khách hàng thành viên
store.loyalty.amount-per-point=10000
store.loyalty.silver-points=500
store.loyalty.gold-points=2000
store.loyalty.silver-discount-percent=3
store.loyalty.gold-discount-percent=5

# Giao hàng
store.delivery.default-fee=15000
store.delivery.max-active-per-shipper=3
store.delivery.max-attempts=3
